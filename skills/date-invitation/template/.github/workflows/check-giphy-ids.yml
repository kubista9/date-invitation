name: Check GIPHY IDs

# Once a day, asks GIPHY whether each saved GIF ID still exists. Failures go into an issue and a report artifact.
# It never edits or deletes anything. Needs a repository secret named GIPHY_API_KEY.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check saved GIPHY IDs
        id: check
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: node scripts/check-giphy-ids.mjs

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giphy-report
          path: giphy-report.json
          if-no-files-found: ignore

      - name: Open or update an issue for failed IDs
        if: steps.check.outputs.failed != '' && steps.check.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Some saved GIPHY GIFs are no longer available"
          body="$(node scripts/check-giphy-ids.mjs --markdown)"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
