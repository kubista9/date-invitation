<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Choose your GIFs</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="giphy/giphy.css">
<style>
  main{display:block;max-width:560px;margin:0 auto}
  .card{margin-bottom:16px;text-align:left}
  select{width:100%;margin-top:6px;font:inherit;padding:.6em;border-radius:14px;border:1.5px solid var(--line);background:var(--cream);color:inherit}
  #out{width:100%;height:200px;font:12px/1.4 ui-monospace,monospace;border:1.5px solid var(--line);border-radius:14px;padding:.7em;background:var(--cream)}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1 style="font-size:1.5rem">Choose your GIFs</h1>
    <p class="sub">Optional. Pick a page, search GIPHY, choose a GIF. Then copy the result and give it to your agent. Nothing is saved on this page.</p>
    <label class="field">Which page is the GIF for?
      <select id="page">
        <option value="ask">Question page</option>
        <option value="happy">Yes page</option>
        <option value="sad">Sad page</option>
        <option value="note">Note page</option>
        <option value="success">Success page</option>
        <option value="open">Opening ticket</option>
      </select>
    </label>
  </section>
  <section class="card" id="host"></section>
  <section class="card">
    <h2 style="font-size:1.1rem;margin-top:0">Your choices</h2>
    <p class="hint" style="font-size:.85rem">These are only GIPHY IDs and credits, no media files. Copy this and paste it to your agent.</p>
    <textarea id="out" readonly aria-label="Your GIF choices"></textarea>
    <button class="btn ghost" id="copy" type="button" style="margin-top:8px">Copy</button>
    <p class="err" id="msg" role="status"></p>
  </section>
</main>
<script src="giphy-env.js"></script>
<script src="giphy/giphy-core.js"></script>
<script src="giphy/giphy-attribution.js"></script>
<script src="giphy/giphy-fallback.js"></script>
<script src="giphy/giphy-gif.js"></script>
<script src="giphy/giphy-picker.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const chosen = {}; // page -> selection, in memory only
  const show = () => {
    const page = $("#page").value;
    const picker = Giphy.GiphyPicker({
      selection: chosen[page] || null,
      onSelect: (s) => { chosen[page] = s; out(); },
      onRemove: () => { delete chosen[page]; out(); },
    });
    $("#host").replaceChildren(picker);
  };
  const out = () => { $("#out").value = Object.keys(chosen).length ? JSON.stringify(chosen, null, 2) : ""; };
  $("#page").addEventListener("change", show);
  $("#copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("#out").value); $("#msg").textContent = "Copied."; }
    catch { $("#out").select(); $("#msg").textContent = "Select and copy the text above."; }
  });
  show();
</script>
</body>
</html>
